<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden – Emil Saga</title>
  <meta name="description" content="Die gesuchte Seite existiert nicht oder wurde verschoben." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#060d0b" />

  <link rel="icon" type="image/png" sizes="48x48" href="/book/favicon-48.png" />
  <link rel="icon" type="image/webp" sizes="32x32" href="/book/favicon-32.webp" />
  <link rel="icon" type="image/webp" sizes="256x256" href="/book/favicon.webp" />
  <link rel="apple-touch-icon" href="/book/favicon-180.webp" />

  <link rel="preload" href="/fonts/cinzeldecorative-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/crimsontext-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cormorantsc-400.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    @font-face{font-family:Cinzel;font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/cinzel-400.woff2') format('woff2')}
    @font-face{font-family:'Cinzel Decorative';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/cinzeldecorative-400.woff2') format('woff2')}
    @font-face{font-family:'Cormorant SC';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/cormorantsc-400.woff2') format('woff2')}
    @font-face{font-family:'Crimson Text';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/crimsontext-400.woff2') format('woff2')}
    @font-face{font-family:'Crimson Text';font-style:italic;font-weight:400;font-display:swap;src:url('/fonts/crimsontext-400i.woff2') format('woff2')}

    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim: #8a6e2e;
      --dark-0: #060d0b;
      --dark-1: #0a1410;
      --text-main: #e2d9c8;
      --text-muted: #9a9080;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html { background: var(--dark-0); }

    body {
      background-color: var(--dark-0);
      color: var(--text-main);
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 18px;
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at top, rgba(201,168,76,0.06), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(30,59,46,0.18), transparent 70%),
        var(--dark-0);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    .label {
      font-family: Cinzel, serif;
      font-size: .82rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.25rem;
      text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }

    .four-oh-four {
      font-family: 'Cormorant SC', serif;
      font-size: clamp(5rem, 18vw, 10rem);
      line-height: 1;
      letter-spacing: .06em;
      margin-bottom: 1.25rem;
      background: linear-gradient(175deg,#fff8dc 0,#f0d060 18%,#d4a832 40%,#b8891e 58%,#d4a832 72%,#f0d060 88%,#fff0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 8px rgba(180,130,20,.45)) drop-shadow(0 0 24px rgba(200,160,40,.25));
    }

    h1 {
      font-family: Cinzel, serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold-light);
      text-shadow: 0 1px 6px rgba(0,0,0,.5);
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin: 1.5rem auto 2rem;
    }

    p.message {
      color: var(--text-muted);
      font-style: italic;
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      padding: .85rem 2.25rem;
      font-family: Cinzel, serif;
      font-size: .88rem;
      font-weight: 400;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dark-0);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      text-decoration: none;
      border-radius: 2px;
      transition: transform 220ms cubic-bezier(.16,1,.3,1), box-shadow 220ms cubic-bezier(.16,1,.3,1);
      box-shadow:
        0 1px 1px 0 rgba(0,0,0,.08),
        0 6px 14px -4px rgba(201,168,76,.35),
        0 0 0 1px rgba(201,168,76,.5);
    }

    .primary-link:hover {
      transform: translateY(-1px);
      box-shadow:
        0 1px 1px 0 rgba(0,0,0,.08),
        0 10px 22px -4px rgba(201,168,76,.5),
        0 0 0 1px rgba(232,201,106,.7);
    }

    .primary-link:active { transform: translateY(0); }

    .primary-link:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    .primary-link svg {
      width: 14px;
      height: 14px;
      transform: translateX(-2px);
      transition: transform 220ms cubic-bezier(.16,1,.3,1);
    }

    .primary-link:hover svg { transform: translateX(-4px); }

    .secondary-links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.75rem;
    }

    .secondary-links a {
      color: var(--gold);
      font-family: Cinzel, serif;
      font-size: .78rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      text-decoration: none;
      padding: .4rem .25rem;
      position: relative;
      transition: color 220ms cubic-bezier(.16,1,.3,1);
    }

    .secondary-links a::after {
      content: '';
      position: absolute;
      left: .25rem;
      right: .25rem;
      bottom: .15rem;
      height: 1px;
      background: var(--gold-light);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 220ms cubic-bezier(.16,1,.3,1);
    }

    .secondary-links a:hover { color: var(--gold-light); }
    .secondary-links a:hover::after { transform: scaleX(1); }

    .secondary-links a:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="container">
    <p class="label">Verloren im Imperium</p>
    <div class="four-oh-four" aria-hidden="true">404</div>
    <h1>Seite nicht gefunden</h1>
    <div class="divider"></div>
    <p class="message">
      Die gesuchte Seite existiert nicht – oder hat sich in den Schatten verloren.
      Vielleicht findest du, was du suchst, an einem dieser Orte:
    </p>

    <a href="/" class="primary-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Zurück zur Startseite
    </a>

    <nav class="secondary-links" aria-label="Weitere Seiten">
      <a href="/leseprobe">Leseprobe</a>
      <a href="/#buy">Buch kaufen</a>
      <a href="/#kontakt">Kontakt</a>
    </nav>
  </main>
</body>
</html>
